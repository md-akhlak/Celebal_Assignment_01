<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>User Registration Form</title>
</head>
<body>
  <h2>User Registration Form</h2>
  <form action="#" method="post">
    
    <label for="username">Username:</label><br>
    <input type="text" id="username" name="username" required><br><br>

    <label for="email">Email:</label><br>
    <input type="email" id="email" name="email" required
           pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$"
           title="Please enter a valid email address."><br><br>

    <label for="password">Password:</label><br>
    <input type="password" id="password" name="password" required
           minlength="8"
           pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}"
           title="Must contain at least 8 characters, including an uppercase letter, a lowercase letter, and a number."><br><br>

    <label for="birthdate">Birthdate:</label><br>
    <input type="date" id="birthdate" name="birthdate" required><br><br>

    <label for="address">Address:</label><br>
    <textarea id="address" name="address" rows="3" cols="30" required></textarea><br><br>

    <label for="phone">Phone Number:</label><br>
    <input type="tel" id="phone" name="phone" required
           pattern="[0-9]{10}"
           maxlength="10"
           title="Enter a 10-digit phone number with numbers only."><br><br>

    <button type="submit">Submit</button>
    <button type="reset">Cancel</button>
    
  </form>
</body>
</html>
