<!DOCTYPE html>
<html>
<head>
  <title>User Registration Form</title>
</head>
<body>

  <center>
    <h1><u>User Registration</u></h1>
  </center>

  <form action="#" method="post">
    <table border="1" cellpadding="10" cellspacing="0" align="center">
      <tr>
        <th align="left"><label for="username">Username:</label></th>
        <td><input type="text" id="username" name="username" required></td>
      </tr>
      <tr>
        <th align="left"><label for="email">Email:</label></th>
        <td><input type="email" id="email" name="email" required></td>
      </tr>
      <tr>
        <th align="left"><label for="password">Password:</label></th>
        <td><input type="password" id="password" name="password" required></td>
      </tr>
      <tr>
        <th align="left"><label for="birthdate">Birthdate:</label></th>
        <td><input type="date" id="birthdate" name="birthdate" required></td>
      </tr>
      <tr>
        <th align="left"><label for="address">Address:</label></th>
        <td><textarea id="address" name="address" rows="3" cols="30" required></textarea></td>
      </tr>
      <tr>
        <th align="left"><label for="phone">Phone Number:</label></th>
        <td><input type="tel" id="phone" name="phone" required></td>
      </tr>
      <tr>
        <td colspan="2" align="center">
          <input type="submit" value="Submit">
          &nbsp;&nbsp;
          <input type="reset" value="Cancel">
        </td>
      </tr>
    </table>
  </form>

  <br><br>

  <center>
    <small><em>All fields are mandatory. Please fill carefully.</em></small>
  </center>

</body>
</html>
